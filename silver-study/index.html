</style><aside><div class="brand"><span id="logo"></span>Silver Study</div><small>学習ワークスペース</small><nav></nav><div class="track"><small>学習コース</small><p>●　DBA Silver</p><button onclick="course()">♧　 Java Gold（SE17）</button></div></aside><main><header><span>学習ワークスペース　 /　 <b id="crumb"></b></span><span class="date" id="clock"></span></header><article id="app"></article></main><dialog id="dlg"></dialog><script>const topics=[

[7,'ブロック領域管理','PCTFREEが確保する空き領域の主な用途は？','既存行の更新','新しい表領域の作成','更新による行の拡張に備え、ブロック内に空きを残します。'],
[8,'UNDO・REDO','読み取り一貫性のために更新前の値を復元する情報は？','UNDO','REDO','UNDOは変更前の状態の復元に使い、REDOは変更の再適用に使います。'],
[11,'SELECT照合','WHERE name LIKE \'A_%\' の「_」は何に一致する？','任意の1文字','0文字以上の任意の文字列','LIKEでは「_」が1文字、「%」が0文字以上に一致します。'],
[13,'TO_CHAR・TO_NUMBER・TO_DATE','日付を指定した書式の文字列に変換する関数は？','TO_CHAR','TO_DATE','TO_CHARは日付や数値を文字列に変換します。'],
[14,'グループ関数','集計後のグループを絞り込む句は？','HAVING','WHERE','WHEREは集計前の行、HAVINGは集計後のグループに適用します。'],
[18,'トランザクション','直前のCOMMIT以降の未確定の変更をすべて取り消す文は？','ROLLBACK','SAVEPOINT','ROLLBACKで現在のトランザクションの未確定の変更を取り消します。'],
[20,'シノニム','別ユーザーの表に対するシノニムを作ると、SELECT権限も付与される？','別途権限が必要','自動的に付与される','シノニムはオブジェクトの別名です。アクセスには適切な権限が必要です。'],

const paths={db:'M3 6c0-5 18-5 18 0s-18 5-18 0m0 0v12c0 5 18 5 18 0V6M3 12c0 5 18 5 18 0',home:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',book:'M3 4q5-2 9 1 4-3 9-1v15q-5-2-9 1-4-3-9-1zM12 5v15',repeat:'M4 10a8 8 0 1 1 1 8M4 4v6h6',history:'M3 10a9 9 0 1 1 1 7M3 4v6h6M12 7v6l4 2',chart:'M4 20h17M6 16v-4m6 4V5m6 11V9',target:'M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0m5 0a4 4 0 1 0 8 0 4 4 0 1 0-8 0',calendar:'M3 5h18v16H3zM3 10h18M7 3v4m10-4v4'};
const icon=k=>'<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[k]+'"/></svg>';
const pages=['ダッシュボード','分野別ノート','誤答の再出題','学習履歴','弱点一覧'],icons=['home','book','repeat','history','target'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=JSON.parse(localStorage.getItem('silver-notes-v1')||'{"logs":[],"exam":"","passed":false}'),page=0;
function save(){localStorage.setItem('silver-notes-v1',JSON.stringify(s))}
function day(offset=0){let d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const recent=i=>s.logs.filter(r=>r.i===i).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),latest=i=>recent(i)[0]||{},all=topics.map((_,i)=>i),levels=['未確認','要復習','学習中','理解済み'];
function modal(title,html){$('dlg').innerHTML='<div class="between"><h2>'+title+'</h2><button class="close" aria-label="閉じる" onclick="dlg.close()">×</button></div>'+html;if(!dlg.open)dlg.showModal()}
function row(i){let r=latest(i);return '<button class="row" onclick="detail('+i+')"><span class="chapter">第'+topics[i][0]+'章</span><span class="info"><b>'+topics[i][1]+'</b></span><span class="pill">'+esc(r.level||'未確認')+'</span> ›</button>'}
function box(k,c,label,value,unit){return '<div class="stat"><span class="iconbox '+c+'">'+icon(k)+'</span><div><small>'+label+'</small><strong>'+value+'<em>'+unit+'</em></strong></div></div>'}
function lastQuiz(i){return recent(i).find(r=>typeof r.correct==='boolean')}
function weak(i){let r=latest(i);return r.level==='要復習'||(r.rate!=null&&r.rate<70)||lastQuiz(i)?.correct===false}
function chart(){let days=Array.from({length:7},(_,i)=>day(i-6)),counts=days.map(d=>s.logs.filter(r=>r.date===d).length),max=Math.max(1,...counts);return '<div class="panel"><div class="head"><h2>学習の推移</h2><span class="pill">直近7日間</span></div><small>学習記録数</small><p><strong style="font-size:27px">'+counts.reduce((a,b)=>a+b,0)+'</strong> 件</p><div class="chart">'+counts.map((n,i)=>'<div class="bar" title="'+days[i]+'：'+n+'件"><i style="height:'+100*n/max+'%"></i></div>').join('')+'</div><div class="axis">'+days.map(d=>'<span>'+d.slice(5).replace('-','/')+'</span>').join('')+'</div></div>'}
function due(i){let d=latest(i).review;return d&&d<=day()}
function menu(){return [...all].sort((a,b)=>Number(!!due(b))-Number(!!due(a))||Number(weak(b))-Number(weak(a))||(latest(a).date||'').localeCompare(latest(b).date||'')||a-b)[0]}
function head(title,sub){return '<h1>'+title+'</h1><p class="subtitle">'+sub+'</p>'}
function render(p=page){page=p;document.querySelector('nav').innerHTML=pages.map((n,i)=>'<button class="'+(i===p?'sel':'')+'" onclick="render('+i+')">'+icon(icons[i])+n+'</button>').join('');$('crumb').textContent=pages[p];let i=menu(),studied=all.filter(i=>recent(i).length).length,rates=all.map(i=>latest(i).rate).filter(v=>v!=null),w=all.filter(weak);
if(p===0)$('app').innerHTML=head('学習ダッシュボード','Oracle DBA Silver（1Z0-082）の学習状況')+'<section class="hero"><div><div class="eyebrow">'+icon('calendar')+' 今日の学習メニュー</div><h2>'+topics[i][1]+'</h2><p>第'+topics[i][0]+'章　·　約5分　·　確認問題 1問</p><button class="primary" onclick="quiz('+i+')">学習をはじめる　 →</button></div><div class="art" aria-hidden="true"><i class="disk d1"></i><i class="disk d2"></i><i class="disk d3"></i></div></section><div class="metrics">'+box('book','','学習済み分野',studied,'/ 13 分野')+box('chart','green','分野平均正答率',rates.length?Math.round(rates.reduce((a,b)=>a+b)/rates.length):'未確認',rates.length?'%':'')+box('repeat','amber','復習予定（今日まで）',all.filter(due).length,'分野')+'</div><div class="columns"><section class="panel"><div class="head"><h2>分野別ノート</h2><button class="link" onclick="render(1)">すべて見る →</button></div>'+all.slice(0,5).map(row).join('')+'</section><div>'+chart()+'<section class="panel"><div class="head"><h2>弱点一覧</h2><button class="link" onclick="render(4)">詳細 →</button></div>'+(w.length?w.slice(0,2).map(row).join(''):'<p class="muted">弱点は未確認です。学習記録から表示します。</p>')+'</section></div></div><button class="secondary" onclick="course()">受験日・学習コースの設定</button>';
if(p===1)$('app').innerHTML=head(pages[p],'教材の章順に並べた13の誤答分野')+'<section class="panel">'+all.map(row).join('')+'</section><a href="https://www.hanmoto.com/bd/isbn/9784798166353" target="_blank" rel="noreferrer">教材の目次を確認 ↗</a>';
if(p===2){let misses=all.filter(i=>lastQuiz(i)?.correct===false);$('app').innerHTML=head(pages[p],'間違えた確認問題をもう一度解き、理解を確かめます。')+'<section class="panel"><h2>再挑戦する問題　'+misses.length+'問</h2>'+(misses.map(i=>'<button class="row" onclick="quiz('+i+')">'+topics[i][1]+'<span>再出題 →</span></button>').join('')||'<p class="muted">再出題する問題はまだありません。</p>')+'</section><section class="panel"><h2>分野別の確認問題</h2>'+all.map(i=>'<button class="row" onclick="quiz('+i+')"><span>'+topics[i][1]+'</span><span class="link">1問解く →</span></button>').join('')+'</section>'}
if(p===3){$('app').innerHTML=head(pages[p],'分野・日付・メモから過去の学習を振り返ります。')+'<div class="filters"><input id="search" placeholder="分野・メモを検索" aria-label="検索" oninput="historyList()"><select id="field" aria-label="分野" onchange="historyList()"><option value="">すべての分野</option>'+all.map(i=>'<option value="'+i+'">'+topics[i][1]+'</option>').join('')+'</select><input type="date" aria-label="学習日" id="filterdate" onchange="historyList()"></div><section class="panel" id="results"></section>';historyList()}
if(p===4)$('app').innerHTML=head(pages[p],'要復習、直近の誤答、または正答率70%未満の分野')+'<section class="panel">'+(w.map(row).join('')||'<p>該当する学習記録はありません。</p>')+'</section><section class="panel"><h2>理解度が未確認の分野</h2>'+all.filter(i=>!latest(i).level||latest(i).level==='未確認').map(row).join('')+'</section>';
}
function historyList(){let q=$('search').value.toLowerCase(),f=$('field').value,d=$('filterdate').value,ls=s.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).filter(r=>(f===''||r.i===+f)&&(!d||d===r.date)&&[topics[r.i][1],r.memo,r.next].join(' ').toLowerCase().includes(q));$('results').innerHTML='<h2>学習記録　'+ls.length+'件</h2>'+ls.map(record).join('')+(ls.length?'':'<p class="muted">該当する記録はありません。</p>')}
const rate=r=>r.rate==null?'未確認':r.rate+'%';
function record(r){let prev=recent(r.i),old=prev[prev.findIndex(x=>x.id===r.id)+1];return '<div class="record"><small>'+esc(r.date)+'　'+(r.correct===undefined?'学習ノート':r.correct?'確認問題・正解':'確認問題・誤答')+'</small><h3>'+topics[r.i][1]+'</h3><div>'+esc(r.level)+'　·　正答率 '+rate(r)+'</div><p class="note">誤答メモ　'+esc(r.memo||'未確認')+'<br>次の論点　'+esc(r.next||'未確認')+'<br>復習予定　'+esc(r.review||'未確認')+'</p><div class="status note">'+(old?'前回（'+esc(old.date)+'）との比較<br>理解度　'+esc(old.level)+' → '+esc(r.level)+'　／　正答率　'+rate(old)+' → '+rate(r)+'<br>前回の論点　'+esc(old.next||'未確認'):'前回との比較　未確認（初回記録）')+'</div></div>'}
function detail(i){let ls=recent(i);modal(topics[i][1],'<p class="muted">第'+topics[i][0]+'章</p><button class="primary" onclick="entry('+i+')">学習を記録</button> <button class="secondary" onclick="quiz('+i+')">確認問題を解く</button>'+(ls.length?ls.map(record).join(''):'<p>理解度・学習日・復習予定・正答率・誤答メモ・次の論点は未確認です。</p>'))}
function entry(i){let r=latest(i);modal('学習を記録','<p>'+topics[i][1]+'</p><form id="form"><div class="formgrid"><label>理解度<select name="level">'+levels.map(v=>'<option '+(v===r.level?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>正答率（%）<input name="rate" type="number" min="0" max="100" step="any" value="'+(r.rate??'')+'" placeholder="未確認"></label><label>学習日<input required name="date" type="date" max="'+day()+'" value="'+day()+'"></label><label>復習予定<input name="review" type="date" value="'+esc(r.review)+'"></label></div><label>誤答メモ<textarea name="memo" placeholder="未確認">'+esc(r.memo)+'</textarea></label><label>次に確認する論点<textarea name="next" placeholder="未確認">'+esc(r.next)+'</textarea></label><button class="primary">記録を保存</button></form>');$('form').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.rate=data.rate===''?null:Number(data.rate);s.logs.push({...data,id:Date.now(),i});save();render();detail(i)}}
function quiz(i){let t=topics[i],order=Math.random()<.5?[3,4]:[4,3];modal('確認問題','<p class="eyebrow">第'+t[0]+'章　'+t[1]+'</p><h3>'+esc(t[2])+'</h3>'+order.map(n=>'<button class="option" onclick="answer('+i+','+n+')">'+esc(t[n])+'</button>').join(''))}
function answer(i,n){let t=topics[i],ok=n===3,r=latest(i),qs=s.logs.filter(x=>x.i===i&&typeof x.correct==='boolean');s.logs.push({id:Date.now(),i,date:day(),review:day(ok?3:1),level:ok?'学習中':'要復習',rate:Math.round(100*(qs.filter(x=>x.correct).length+Number(ok))/(qs.length+1)),memo:ok?r.memo||'':t[2]+'　選択：'+t[n],next:r.next||'',correct:ok});save();render();modal(ok?'正解です':'もう一度確認しましょう','<h3>正解　'+esc(t[3])+'</h3><p>'+esc(t[5])+'</p><p class="muted">結果を保存しました。復習予定は'+day(ok?3:1)+'です。</p><button class="primary" onclick="entry('+i+')">メモを記録</button> <button class="secondary" onclick="dlg.close()">完了</button>')}
function course(){modal('学習コース','<h3>Oracle DBA Silver（1Z0-082）</h3><label>受験日<input id="exam" type="date" value="'+esc(s.exam)+'"></label><label style="display:block"><input id="passed" style="width:auto" type="checkbox" '+(s.passed?'checked':'')+'> DBA Silver に合格した</label><h3>Java Gold（SE17）</h3><p class="muted">'+(s.passed?'DBA Silver合格後の学習コース':'DBA Silver合格後に開始')+'</p><button class="primary" onclick="s.exam=exam.value;s.passed=passed.checked;save();dlg.close();render()">設定を保存</button>')}
$('logo').innerHTML=icon('db');$('clock').textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});render();
</script></html>
